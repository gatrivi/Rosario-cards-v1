name: Rosa interaction contract

on:
  push:
    branches:
      - cloud-rosary-v2
  pull_request:

jobs:
  rosa-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify Rosa interaction and drawing
        env:
          CI: true
        run: npm test -- --watchAll=false --runInBand src/__tests__/RoseViewInteraction.test.js src/__tests__/RoseDrawingProgress.test.js src/__tests__/RoseView.test.js src/__tests__/cloudSyncSharedClassic.test.js

      - name: Production build
        env:
          CI: false
        run: npm run build
