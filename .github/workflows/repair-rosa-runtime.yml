name: Ship Rosa runtime repair

on:
  push:
    branches:
      - cloud-rosary-v2
    paths:
      - .github/workflows/repair-rosa-runtime.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout cloud-rosary-v2
        uses: actions/checkout@v4
        with:
          ref: cloud-rosary-v2
          fetch-depth: 0

      - name: Patch Rosa runtime contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              p.write_text(text.replace(old, new, 1))
              print(f'patched {label}')

          rose = 'src/components/Views/RoseView.jsx'

          replace_once(
              rose,
              "import { useCloudSync } from '../../hooks/useCloudSync';\n",
              '',
              'remove duplicate RoseView cloud hook import',
          )

          replace_once(
              rose,
              """  // ─── Cloud Sync ───\n  const { cloudState, syncToCloud } = useCloudSync();\n  const [loadedPrayerIndex, setLoadedPrayerIndex] = useState(false);\n\n  useEffect(() => {\n    if (cloudState && !loadedPrayerIndex) {\n      const idx = cloudState.rosaryIndex ?? cloudState.bookletIndex;\n      if (idx !== undefined && cloudState.todayDate === new Date().toDateString()) {\n        onUpdateProgreso(Math.min(idx, secuencia.length - 1));\n      }\n      setLoadedPrayerIndex(true);\n    }\n  }, [cloudState, loadedPrayerIndex, secuencia.length, onUpdateProgreso]);\n\n  useEffect(() => {\n    if (loadedPrayerIndex) {\n      syncToCloud({\n        rosaryIndex: currentPrayerIndex,\n        todayDate: new Date().toDateString(),\n      });\n    }\n  }, [currentPrayerIndex, loadedPrayerIndex]); // eslint-disable-line react-hooks/exhaustive-deps\n\n""",
              """  // Progress/cloud ownership lives in AppShell. Rosa only reports user progress\n  // through onUpdateProgreso so Libro ↔ Rosario ↔ Rosa cannot race each other.\n\n""",
              'remove duplicate RoseView cloud synchronization',
          )

          replace_once(
              rose,
              """  const pointerStartedInTextRef = useRef(false);\n  const isVerticalGesture = useRef(false);\n""",
              """  const pointerStartedInTextRef = useRef(false);\n  const pointerIsDownRef = useRef(false);\n  const isVerticalGesture = useRef(false);\n""",
              'add pointer-down ref',
          )

          replace_once(
              rose,
              """  const handleTrackPointer = (clientX, clientY, pointerType) => {\n    if (!hasInteracted) setHasInteracted(true);\n""",
              """  const handleTrackPointer = (clientX, clientY, pointerType) => {\n    // Same contract on desktop and mobile: movement only prays while pressed.\n    // This prevents desktop hover from silently revealing the prayer.\n    if (!pointerIsDownRef.current) return;\n    if (!hasInteracted) setHasInteracted(true);\n""",
              'require pressed pointer before drag-to-pray',
          )

          replace_once(
              rose,
              """  const handlePointerDown = (e) => {\n    debug(`[RoseView] PointerDown: ${e.pointerType}`);\n    initAudio();\n""",
              """  const handlePointerDown = (e) => {\n    debug(`[RoseView] PointerDown: ${e.pointerType}`);\n    pointerIsDownRef.current = true;\n    initAudio();\n""",
              'mark pointer down',
          )

          replace_once(
              rose,
              """    if (e.pointerType === 'touch' && e.target.setPointerCapture) {\n      e.target.setPointerCapture(e.pointerId);\n    }\n""",
              """    // Capture mouse, pen and touch alike so a drag remains continuous even\n    // when the pointer briefly leaves the text/surface.\n    if (e.target.setPointerCapture) {\n      try { e.target.setPointerCapture(e.pointerId); } catch (_) { /* unsupported pointer */ }\n    }\n""",
              'capture pointer on every input type',
          )

          replace_once(
              rose,
              """  const handlePointerUp = (e) => {\n    debug(`[RoseView] PointerUp: PrayerComp=${isPrayerCompleteRef.current}, VersoComp=${isVersoCompleteRef.current}`);\n    setIsCargando(false);\n""",
              """  const handlePointerUp = (e) => {\n    debug(`[RoseView] PointerUp: PrayerComp=${isPrayerCompleteRef.current}, VersoComp=${isVersoCompleteRef.current}`);\n    pointerIsDownRef.current = false;\n    setIsCargando(false);\n""",
              'clear pointer-down state',
          )

          replace_once(
              rose,
              """    onPointerUp={handlePointerUp}\n    onPointerLeave={handlePointerUp}\n""",
              """    onPointerUp={handlePointerUp}\n    onPointerCancel={handlePointerUp}\n    onPointerLeave={handlePointerUp}\n""",
              'handle pointer cancellation',
          )

          app = 'src/components/Layout/AppShell.jsx'
          replace_once(
              app,
              "const APP_VERSION = '0.3.79';",
              "const APP_VERSION = '0.3.81';",
              'bump visible app version',
          )

          replace_once(
              app,
              """      const paso = ['rosary', 'rose'].includes(vistaActiva)\n        ? rosaryPrayerIndex\n        : currentPrayerIndex;\n""",
              """      const isRosarySurface = ['rosary', 'rose'].includes(vistaActiva);\n      const paso = isRosarySurface && !isValidRosaryMystery(misterioActual)\n        ? rosaryPrayerIndex\n        : currentPrayerIndex;\n""",
              'keep classic Rosa URL step on shared progress',
          )

          sw = 'public/service-worker.js'
          replace_once(
              sw,
              "const CACHE_NAME = 'rosario-cards-v0.3.80';",
              "const CACHE_NAME = 'rosario-cards-v0.3.81';",
              'bump PWA cache',
          )
          replace_once(
              sw,
              """    caches.open(CACHE_NAME)\n      .then((cache) => cache.addAll(SHELL_URLS))\n""",
              """    caches.open(CACHE_NAME)\n      .then((cache) => cache.addAll(SHELL_URLS))\n      .then(() => self.skipWaiting())\n""",
              'activate PWA update without stale waiting worker',
          )

          notes = 'src/data/releaseNotes.js'
          replace_once(notes, "version: '0.3.80'", "version: '0.3.81'", 'bump release notes version')
          replace_once(notes, "name: 'Luján share'", "name: 'Rosa drag contract'", 'name release')
          replace_once(
              notes,
              """  CURRENT: [\n    'Luján 2026: compartir Rosario desde Camino',\n    'Sostén voluntario listo para link de donación',\n  ],\n""",
              """  CURRENT: [\n    'Rosa: mantener y arrastrar funciona igual con mouse y touch',\n    'Libro · Rosario · Rosa comparten el mismo progreso clásico',\n    'PWA actualiza el bundle sin quedar atrapada en la versión anterior',\n  ],\n""",
              'document Rosa runtime release',
          )

          test = 'src/__tests__/RoseViewInteraction.test.js'
          marker = """  test.each(['mouse', 'touch'])('%s drag reveals prayer text and grows the Ave Maria rose', (pointerType) => {\n"""
          hover_test = """  test('desktop hover alone does not pray or grow the rose', () => {\n    const { surface } = renderAveMaria();\n\n    fireEvent.pointerMove(surface, {\n      pointerId: 1,\n      pointerType: 'mouse',\n      clientX: 90,\n      clientY: 165,\n    });\n\n    expect(Number(screen.getByTestId('sacred-text').dataset.charProgress)).toBe(-1);\n    expect(Number(screen.getByTestId('rose-drawing').dataset.progress)).toBe(0);\n  });\n\n"""
          replace_once(test, marker, hover_test + marker, 'regression: hover must not pray')
          PY

      - name: Align package version
        run: npm version 0.3.81 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Verify Rosa contract
        env:
          CI: true
        run: npm test -- --watchAll=false --runInBand src/__tests__/RoseViewInteraction.test.js src/__tests__/RoseDrawingProgress.test.js src/__tests__/RoseView.test.js src/__tests__/cloudSyncSharedClassic.test.js

      - name: Verify production build
        env:
          CI: false
        run: npm run build

      - name: Commit runtime repair
        shell: bash
        run: |
          rm .github/workflows/repair-rosa-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: ship Rosa drag contract v0.3.81"
          git push origin HEAD:cloud-rosary-v2
